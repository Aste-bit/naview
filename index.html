// ─── IndexedDB Layer ───
const idb = {
  db: null,
  STORES: ['nv_projects','nv_milestones','nv_blockers','nv_wins'],
  async open() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('naview', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        this.STORES.forEach(name => {
          if (!db.objectStoreNames.contains(name)) {
            const store = db.createObjectStore(name, { keyPath: 'id' });
            if (name !== 'nv_projects') store.createIndex('project_id', 'project_id', { unique: false });
          }
        });
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
      req.onerror = (e) => reject(e.target.error);
    });
  },
  async getAll(storeName, orderBy) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const req = store.getAll();
      req.onsuccess = () => {
        let results = req.result || [];
        if (orderBy) results.sort((a,b) => {
          if (orderBy === 'created_at') return new Date(b[orderBy]) - new Date(a[orderBy]);
          return (a[orderBy]||0) - (b[orderBy]||0);
        });
        resolve(results);
      };
      req.onerror = () => reject(req.error);
    });
  },
  async getByIndex(storeName, indexName, value) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const idx = store.index(indexName);
      const req = idx.getAll(value);
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  async put(storeName, data) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.put(data);
      req.onsuccess = () => resolve(data);
      req.onerror = () => reject(req.error);
    });
  },
  async delete(storeName, id) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },
  async clear(storeName) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  async clearAll() {
    for (const s of this.STORES) await this.clear(s);
  }
};

// ─── Data Layer (abstracts Local vs Cloud) ───
const dl = {
  isLocal() { return state.mode === 'local'; },

  async loadProjects() {
    if (this.isLocal()) {
      return { data: await idb.getAll('nv_projects', 'sort_order'), error: null };
    }
    return await sb.from('nv_projects').select('*').order('sort_order');
  },
  async loadRelated(ids) {
    if (this.isLocal()) {
      const milestones = []; const blockers = []; const wins = [];
      for (const id of ids) {
        milestones.push(...await idb.getByIndex('nv_milestones','project_id',id));
        blockers.push(...await idb.getByIndex('nv_blockers','project_id',id));
        wins.push(...await idb.getByIndex('nv_wins','project_id',id));
      }
      milestones.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
      blockers.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
      wins.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      return [{ data: milestones }, { data: blockers }, { data: wins }];
    }
    return await Promise.all([
      sb.from('nv_milestones').select('*').in('project_id', ids).order('sort_order'),
      sb.from('nv_blockers').select('*').in('project_id', ids).order('sort_order'),
      sb.from('nv_wins').select('*').in('project_id', ids).order('created_at', { ascending: false }),
    ]);
  },
  async insertProject(data) {
    if (this.isLocal()) {
      data.id = crypto.randomUUID();
      await idb.put('nv_projects', data);
      return { data, error: null };
    }
    return await sb.from('nv_projects').insert(data).select().single();
  },
  async updateProject(id, data) {
    if (this.isLocal()) {
      const all = await idb.getAll('nv_projects');
      const p = all.find(x=>x.id===id);
      if (p) { Object.assign(p, data); await idb.put('nv_projects', p); }
      return { error: null };
    }
    return await sb.from('nv_projects').update(data).eq('id', id);
  },
  async deleteProject(id) {
    if (this.isLocal()) {
      await idb.delete('nv_projects', id);
      // cascade delete related
      const ms = await idb.getByIndex('nv_milestones','project_id',id);
      const bs = await idb.getByIndex('nv_blockers','project_id',id);
      const ws = await idb.getByIndex('nv_wins','project_id',id);
      for (const m of ms) await idb.delete('nv_milestones', m.id);
      for (const b of bs) await idb.delete('nv_blockers', b.id);
      for (const w of ws) await idb.delete('nv_wins', w.id);
      return { error: null };
    }
    return await sb.from('nv_projects').delete().eq('id', id);
  },
  async insertMilestone(data) {
    if (this.isLocal()) {
      data.id = crypto.randomUUID();
      await idb.put('nv_milestones', data);
      return { data, error: null };
    }
    return await sb.from('nv_milestones').insert(data).select().single();
  },
  async updateMilestone(id, data) {
    if (this.isLocal()) {
      const all = await idb.getAll('nv_milestones');
      const m = all.find(x=>x.id===id);
      if (m) { Object.assign(m, data); await idb.put('nv_milestones', m); }
      return { error: null };
    }
    return await sb.from('nv_milestones').update(data).eq('id', id);
  },
  async deleteMilestone(id) {
    if (this.isLocal()) { await idb.delete('nv_milestones', id); return { error: null }; }
    return await sb.from('nv_milestones').delete().eq('id', id);
  },
  async insertBlocker(data) {
    if (this.isLocal()) {
      data.id = crypto.randomUUID();
      await idb.put('nv_blockers', data);
      return { data, error: null };
    }
    return await sb.from('nv_blockers').insert(data).select().single();
  },
  async updateBlocker(id, data) {
    if (this.isLocal()) {
      const all = await idb.getAll('nv_blockers');
      const b = all.find(x=>x.id===id);
      if (b) { Object.assign(b, data); await idb.put('nv_blockers', b); }
      return { error: null };
    }
    return await sb.from('nv_blockers').update(data).eq('id', id);
  },
  async deleteBlocker(id) {
    if (this.isLocal()) { await idb.delete('nv_blockers', id); return { error: null }; }
    return await sb.from('nv_blockers').delete().eq('id', id);
  },
  async insertWin(data) {
    if (this.isLocal()) {
      data.id = crypto.randomUUID();
      data.created_at = data.created_at || new Date().toISOString();
      await idb.put('nv_wins', data);
      return { data, error: null };
    }
    return await sb.from('nv_wins').insert(data).select().single();
  },
  async deleteWin(id) {
    if (this.isLocal()) { await idb.delete('nv_wins', id); return { error: null }; }
    return await sb.from('nv_wins').delete().eq('id', id);
  },
  async updateProjectProgress(id, progress) {
    return await this.updateProject(id, { progress });
  },

  // ─── Export / Import ───
  async exportAll() {
    let projects, milestones, blockers, wins;
    if (this.isLocal()) {
      projects = await idb.getAll('nv_projects','sort_order');
      milestones = await idb.getAll('nv_milestones','sort_order');
      blockers = await idb.getAll('nv_blockers','sort_order');
      wins = await idb.getAll('nv_wins','created_at');
    } else {
      projects = state.projects;
      milestones = Object.values(state.milestones).flat();
      blockers = Object.values(state.blockers).flat();
      wins = Object.values(state.wins).flat();
    }
    return {
      version: 2,
      exportedAt: new Date().toISOString(),
      app: 'naview',
      data: { projects, milestones, blockers, wins }
    };
  },
  async importAll(json) {
    const { data: d } = json;
    if (!d || !d.projects) throw new Error('Invalid format');
    if (this.isLocal()) {
      await idb.clearAll();
      for (const p of d.projects) await idb.put('nv_projects', p);
      for (const m of d.milestones||[]) await idb.put('nv_milestones', m);
      for (const b of d.blockers||[]) await idb.put('nv_blockers', b);
      for (const w of d.wins||[]) await idb.put('nv_wins', w);
    } else {
      // Cloud import: insert each record via Supabase
      const uid = state.user.id;
      for (const p of d.projects) {
        p.user_id = uid;
        await sb.from('nv_projects').upsert(p);
      }
      for (const m of d.milestones||[]) { m.user_id = uid; await sb.from('nv_milestones').upsert(m); }
      for (const b of d.blockers||[]) { b.user_id = uid; await sb.from('nv_blockers').upsert(b); }
      for (const w of d.wins||[]) { w.user_id = uid; await sb.from('nv_wins').upsert(w); }
    }
  }
};

// ─── Toast ───
function toast(msg, type='success', action=null) {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  const colors = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-amber-500';
  el.className = `toast px-4 py-2.5 rounded-xl text-white text-sm font-medium shadow-lg ${colors} flex items-center gap-3`;
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if (action) {
    const btn = document.createElement('button');
    btn.textContent = action.label;
    btn.className = 'ml-auto px-2.5 py-1 rounded-lg bg-white/20 hover:bg-white/30 text-xs font-bold transition-all shrink-0';
    btn.onclick = (e) => { e.stopPropagation(); el.remove(); action.fn(); };
    el.appendChild(btn);
  }
  c.appendChild(el);
  const dur = action ? 5000 : 2500;
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, dur);
}

// ─── Data Loading ───
async function loadAllData() {
  state.loading = true;
  render();
  try {
    const { data: projects, error: pe } = await dl.loadProjects();
    if (pe) throw pe;
    state.projects = projects || [];
    const ids = state.projects.map(p => p.id);
    if (ids.length) {
      const [mRes, bRes, wRes] = await dl.loadRelated(ids);
      state.milestones = {}; state.blockers = {}; state.wins = {};
      (mRes.data || []).forEach(m => { (state.milestones[m.project_id] ??= []).push(m); });
      (bRes.data || []).forEach(b => { (state.blockers[b.project_id] ??= []).push(b); });
      (wRes.data || []).forEach(w => { (state.wins[w.project_id] ??= []).push(w); });
    } else {
      state.milestones = {}; state.blockers = {}; state.wins = {};
    }
  } catch(e) {
    console.error(e);
    toast('データ読み込みエラー', 'error');
  }
  state.loading = false;
  render();
}

// ─── Helpers ───
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function ring(progress, size=56, color='#3b82f6') {
  const sw=4.5, r=(size-sw*2)/2, c=2*Math.PI*r, off=c-(progress/100)*c;
  return `<div class="relative" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)" class="ring-anim">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>
    <div class="absolute inset-0 flex items-center justify-center">
      <span class="text-xs font-bold text-gray-700">${progress}%</span>
    </div>
  </div>`;
}

window.doExport = async function() {
  state.settingsOpen = false;
  try {
    const data = await dl.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `naview-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('エクスポート完了');
  } catch(e) {
    console.error(e);
    toast('エクスポートエラー','error');
  }
  render();
};

window.doImport = function() {
  state.settingsOpen = false;
  render();
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const json = JSON.parse(text);
      if (!json.data || !json.data.projects) { toast('無効なファイル形式','error'); return; }
      if (!confirm(`${json.data.projects.length}件のプロジェクトをインポートしますか？\n現在のデータは上書きされます。`)) return;
      await dl.importAll(json);
      await loadAllData();
      toast(`${json.data.projects.length}件インポート完了`);
    } catch(err) {
      console.error(err);
      toast('インポートエラー','error');
    }
  };
  input.click();
};

    return `<div class="bg-white rounded-2xl border border-${colorName}-100 p-4 ${faded?'opacity-60':''}">
      <div class="text-xs font-bold text-${colorName}-500 mb-2 flex items-center gap-2">

// ─── CRUD Actions ───
window.setTab = function(t) { state.tab = t; render(); };
window.toggleExpand = function(id) { state.expandedId = state.expandedId===id ? null : id; render(); };
window.doLogout = async function() {
  if (state.mode === 'cloud' && sb) await sb.auth.signOut();
  state.user = null; state.projects = []; state.mode = null;
  localStorage.removeItem('nv_mode');
  render();
};

window.toggleMilestone = async function(id, done) {
  const { error } = await dl.updateMilestone(id, { done });
  if(error) { toast('更新エラー','error'); return; }
  let targetPid = null;
  for(const pid in state.milestones) {
    const m = state.milestones[pid].find(m=>m.id===id);
    if(m) { m.done = done; targetPid = pid; await recalcProgress(pid); break; }
  }
  render();
  const label = done ? 'マイルストーン完了' : 'マイルストーン戻し';
  toast(label, 'success', { label: '元に戻す', fn: () => toggleMilestone(id, !done) });
};

async function recalcProgress(pid) {
  const ms = state.milestones[pid]||[];
  if(!ms.length) return;
  const progress = Math.round((ms.filter(m=>m.done).length / ms.length) * 100);
  await dl.updateProjectProgress(pid, progress);
  const p = state.projects.find(p=>p.id===pid);
  if(p) p.progress = progress;
}

window.deleteProject = async function(id) {
  if(!confirm('このプロジェクトを削除しますか？')) return;
  const { error } = await dl.deleteProject(id);
  if(error) { toast('削除エラー','error'); return; }
  state.projects = state.projects.filter(p=>p.id!==id);
  delete state.milestones[id]; delete state.blockers[id]; delete state.wins[id];
  if(state.expandedId===id) state.expandedId=null;
  toast('削除しました'); render();
};

window.deleteMilestone = async function(id, pid) {
  const { error } = await dl.deleteMilestone(id);
  if(error) { toast('削除エラー','error'); return; }
  state.milestones[pid] = (state.milestones[pid]||[]).filter(m=>m.id!==id);
  await recalcProgress(pid);
  toast('削除しました'); render();
};

window.deleteBlocker = async function(id, pid) {
  const { error } = await dl.deleteBlocker(id);
  if(error) { toast('削除エラー','error'); return; }
  state.blockers[pid] = (state.blockers[pid]||[]).filter(b=>b.id!==id);
  toast('削除しました'); render();
};

window.deleteWin = async function(id, pid) {
  const { error } = await dl.deleteWin(id);
  if(error) { toast('削除エラー','error'); return; }
  state.wins[pid] = (state.wins[pid]||[]).filter(w=>w.id!==id);
  toast('削除しました'); render();
};

window.cycleBlockerType = async function(id, current, pid) {
  const order = ['ai','human','solved'];
  const next = order[(order.indexOf(current)+1) % order.length];
  const { error } = await dl.updateBlocker(id, { type: next });
  if(error) { toast('更新エラー','error'); return; }
  const b = (state.blockers[pid]||[]).find(b=>b.id===id);
  if(b) b.type = next;
  toast(`タイプ変更: ${blockerStyles[next].label}`); render();
};

window.addWin = async function(pid) {
  const text = prompt('成果を入力:');
  if(!text?.trim()) return;
  const { data, error } = await dl.insertWin({ project_id: pid, user_id: state.user.id, text: text.trim() });
  if(error) { toast('追加エラー','error'); return; }
  (state.wins[pid]??=[]).unshift(data);
  toast('追加しました'); render();
};

window.saveProject = async function(id) {
  const name = document.getElementById('m-name').value.trim();
  if(!name) { toast('名前を入力してください','error'); return; }
  const data = {
    name,
    color: document.getElementById('m-color-val').value,
    health: document.getElementById('m-health').value,
    goal: document.getElementById('m-goal').value.trim(),
    done_image: document.getElementById('m-doneimg').value.trim(),
    phase: document.getElementById('m-phase').value.trim(),
    owner: document.getElementById('m-owner').value.trim(),
  };
  if(id) {
    const progEl = document.getElementById('m-progress');
    if(progEl) data.progress = parseInt(progEl.value);
    const { error } = await dl.updateProject(id, data);
    if(error) { toast('更新エラー','error'); return; }
    const p = state.projects.find(p=>p.id===id);
    if(p) Object.assign(p, data);
  } else {
    data.user_id = state.user.id;
    data.progress = 0;
    data.sort_order = state.projects.length + 1;
    const { data: newP, error } = await dl.insertProject(data);
    if(error) { toast('追加エラー','error'); return; }
    state.projects.push(newP);
    state.milestones[newP.id] = [];
    state.blockers[newP.id] = [];
    state.wins[newP.id] = [];
  }
  document.getElementById('modal-overlay').remove();
  toast(id?'更新しました':'追加しました'); render();
};

    </div>
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2">
      <button onclick="document.getElementById('modal-overlay').remove()" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">キャンセル</button>
      <button onclick="saveMilestone('${pid}')" class="px-5 py-2 rounded-xl text-sm font-semibold text-white btn-primary">追加</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  setTimeout(()=>document.getElementById('m-ms-label').focus(),100);
};

window.saveMilestone = async function(pid) {
  const label = document.getElementById('m-ms-label').value.trim();
  if(!label) { toast('名前を入力してください','error'); return; }
  const ms = state.milestones[pid]||[];
  const { data, error } = await dl.insertMilestone({
    project_id: pid, user_id: state.user.id, label, done: false, sort_order: ms.length+1
  });
  if(error) { toast('追加エラー','error'); return; }
  (state.milestones[pid]??=[]).push(data);
  await recalcProgress(pid);
  document.getElementById('modal-overlay').remove();
  toast('追加しました'); render();
};

// ─── Modal: Blocker ───
window.openBlockerModal = function(pid) {
  const modal = document.createElement('div');
  modal.id = 'modal-overlay';
  modal.className = 'fixed inset-0 z-40 modal-overlay flex items-center justify-center p-4';
  modal.onclick = (e) => { if(e.target===modal) modal.remove(); };
  modal.innerHTML = `
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm fade-in" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <h2 class="text-base font-bold text-gray-800">課題追加</h2>
      <button onclick="document.getElementById('modal-overlay').remove()" class="text-gray-300 hover:text-gray-500">${icons.x}</button>
    </div>
    <div class="px-6 py-5 space-y-3">
      <input id="m-b-text" placeholder="課題の内容" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm">
      <select id="m-b-type" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm">
        <option value="ai">AI対応可</option>
        <option value="human">人に聞く</option>
        <option value="solved">解決済み</option>
      </select>
      <input id="m-b-detail" placeholder="詳細・Next Action (任意)" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm">
    </div>
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2">
      <button onclick="document.getElementById('modal-overlay').remove()" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">キャンセル</button>
      <button onclick="saveBlocker('${pid}')" class="px-5 py-2 rounded-xl text-sm font-semibold text-white btn-primary">追加</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  setTimeout(()=>document.getElementById('m-b-text').focus(),100);
};

window.saveBlocker = async function(pid) {
  const text = document.getElementById('m-b-text').value.trim();
  if(!text) { toast('内容を入力してください','error'); return; }
  const bs = state.blockers[pid]||[];
  const { data, error } = await dl.insertBlocker({
    project_id: pid, user_id: state.user.id, text,
    type: document.getElementById('m-b-type').value,
    detail: document.getElementById('m-b-detail').value.trim() || null,
    sort_order: bs.length+1
  });
  if(error) { toast('追加エラー','error'); return; }
  (state.blockers[pid]??=[]).push(data);
  document.getElementById('modal-overlay').remove();
  toast('追加しました'); render();
};

// ─── Render Engine ───
function render() {
  const app = document.getElementById('app');
  // Mode selection screen
  if (!state.mode) { app.innerHTML = renderModeSelect(); return; }
  // Cloud mode: need auth
  if (state.mode === 'cloud' && !state.user) { app.innerHTML = renderAuth(); return; }
  // Loading
  if (state.loading) { app.innerHTML = renderLoading(); return; }
  // Dashboard
  app.innerHTML = renderDashboard();
}

// ─── Init ───
async function init() {
  if (state.mode === 'local') {
    await idb.open();
    state.user = { id: 'local-user', email: 'ローカル' };
    await loadAllData();
  } else if (state.mode === 'cloud' && sb) {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      state.user = session.user;
      await loadAllData();
    } else {
      render();
    }
    sb.auth.onAuthStateChange((event, session) => {
      state.user = session?.user || null;
      if (!session) { state.projects=[]; render(); }
    });
  } else {
    // No mode selected yet
    render();
  }
}
init();
</script>
</body>
</html>
