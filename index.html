  .fade-in { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
  @keyframes countUp { from { opacity:0 } to { opacity:1 } }
  .ring-anim circle:nth-child(2) { transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
  .line-clamp-1 { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }

// ─── Toast ───
function toast(msg, type='success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  const colors = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-amber-500';
  el.className = `toast px-4 py-2.5 rounded-xl text-white text-sm font-medium shadow-lg ${colors}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2500);
}

// ─── Data Loading ───
async function loadAllData() {
  state.loading = true;
  render();
  try {
    const { data: projects, error: pe } = await sb.from('nv_projects').select('*').order('sort_order');
    if (pe) throw pe;
    state.projects = projects || [];
    // Load related data for all projects
    const ids = state.projects.map(p => p.id);
    if (ids.length) {
      const [mRes, bRes, wRes] = await Promise.all([
        sb.from('nv_milestones').select('*').in('project_id', ids).order('sort_order'),
        sb.from('nv_blockers').select('*').in('project_id', ids).order('sort_order'),
        sb.from('nv_wins').select('*').in('project_id', ids).order('created_at', { ascending: false }),
      ]);
      // Group by project_id
      state.milestones = {}; state.blockers = {}; state.wins = {};
      (mRes.data || []).forEach(m => { (state.milestones[m.project_id] ??= []).push(m); });
      (bRes.data || []).forEach(b => { (state.blockers[b.project_id] ??= []).push(b); });
      (wRes.data || []).forEach(w => { (state.wins[w.project_id] ??= []).push(w); });
    }
  } catch(e) {
    console.error(e);
    toast('データ読み込みエラー', 'error');
  }
  state.loading = false;
  render();
}

// ─── Helpers ───
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function ring(progress, size=56, color='#3b82f6') {
  const sw=4.5, r=(size-sw*2)/2, c=2*Math.PI*r, off=c-(progress/100)*c;
  return `<div class="relative" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)" class="ring-anim">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>
    <div class="absolute inset-0 flex items-center justify-center">
      <span class="text-xs font-bold text-gray-700">${progress}%</span>
    </div>
  </div>`;
}

          <button onclick="switchAuthTab('signup')" id="auth-tab-signup"
            class="flex-1 py-2 rounded-lg text-xs font-semibold transition-all text-gray-400">新規登録</button>
        </div>
        <div id="auth-error" class="hidden text-xs text-red-500 bg-red-50 rounded-lg p-2.5 mb-4"></div>
        <input id="auth-email" type="email" placeholder="メールアドレス"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm mb-3 bg-gray-50/50">
        <input id="auth-pass" type="password" placeholder="パスワード"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm mb-4 bg-gray-50/50">
        <button onclick="doAuth()" id="auth-btn"
          class="w-full btn-primary text-white font-bold py-3 rounded-xl text-sm transition-all">ログイン</button>
      </div>
    </div>
  </div>`;
}
let authTab = 'login';
window.switchAuthTab = function(t) {
  authTab = t;
  document.getElementById('auth-tab-login').className = `flex-1 py-2 rounded-lg text-xs font-semibold transition-all ${t==='login'?'bg-white text-gray-800 shadow-sm':'text-gray-400'}`;
  document.getElementById('auth-tab-signup').className = `flex-1 py-2 rounded-lg text-xs font-semibold transition-all ${t==='signup'?'bg-white text-gray-800 shadow-sm':'text-gray-400'}`;
  document.getElementById('auth-btn').textContent = t==='login'?'ログイン':'新規登録';
};
window.doAuth = async function() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const errEl = document.getElementById('auth-error');
  if(!email||!pass){ errEl.textContent='入力してください'; errEl.classList.remove('hidden'); return; }
  errEl.classList.add('hidden');
  const btn = document.getElementById('auth-btn');
  btn.disabled=true; btn.textContent='...';
  let res;
  if(authTab==='login') res = await sb.auth.signInWithPassword({email,password:pass});
  else res = await sb.auth.signUp({email,password:pass});
  if(res.error){ errEl.textContent=res.error.message; errEl.classList.remove('hidden'); btn.disabled=false; btn.textContent=authTab==='login'?'ログイン':'新規登録'; return; }
  state.user = res.data.user;
  await loadAllData();
};

  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8 fade-in">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">

          style="background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a78bfa 100%)">
          <span class="text-white">${icons.barChart}</span>
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-gray-800 tracking-tight">Naview</h1>
          <p class="text-[11px] text-gray-400 font-medium tracking-wide">Navigate your work, view your growth</p>
        </div>
      </div>
      <div class="flex items-center gap-3">

            class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold transition-all ${state.tab==='overview'?'bg-gray-800 text-white shadow-sm':'text-gray-400 hover:text-gray-600'}">
            <span class="${state.tab==='overview'?'text-white':'text-gray-400'}">${icons.activity}</span> 概要
          </button>
          <button onclick="setTab('blockers')"
            class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold transition-all ${state.tab==='blockers'?'bg-gray-800 text-white shadow-sm':'text-gray-400 hover:text-gray-600'}">
            <span class="${state.tab==='blockers'?'text-white':'text-gray-400'}">${icons.alertTri}</span> 課題
            ${totalBlockers>0?`<span class="w-5 h-5 rounded-full text-[10px] flex items-center justify-center font-bold ${state.tab==='blockers'?'bg-white/20 text-white':'bg-amber-100 text-amber-600'}">${totalBlockers}</span>`:''}

      ${renderPillar(icons.target, '期待値定義', ps.filter(p=>p.done_image).length+'/'+ps.length, '#6366f1', 'ゴール言語化済み')}
      ${renderPillar(icons.eye, '進捗可視化', avgProgress+'%', '#10b981', '全体平均')}

function renderPillar(icon, title, stat, color, desc) {
  return `<div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm card-hover group">
    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-3 transition-transform group-hover:scale-105"

    <div class="text-2xl font-extrabold text-gray-800 tabular-nums mb-0.5">${esc(stat)}</div>
    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">${esc(title)}</p>
    <p class="text-[11px] text-gray-400 mt-0.5">${esc(desc)}</p>
  </div>`;
}

function renderOverviewTab(active, humanItems, aiItems) {
  const sorted = [...active].sort((a,b) => b.progress-a.progress);
  const sortedCards = [...active].sort((a,b) => {
    const order = {stalled:0, caution:1, good:2};
    return (order[a.health]??3)-(order[b.health]??3);
  });

  return `
    <!-- Add Project Button -->
    <div class="mb-4 flex justify-end">
      <button onclick="openProjectModal()" class="flex items-center gap-1.5 px-4 py-2 rounded-xl btn-primary text-white text-xs font-semibold shadow-sm hover:shadow transition-all">
        ${icons.plus} プロジェクト追加
      </button>
    </div>

    <!-- Overview Bar -->
    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm mb-4">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">全プロジェクト進捗</span>
        <span class="text-xs text-gray-300">${active.length}件</span>
      </div>
      <div class="space-y-2.5">
        ${sorted.map(p => {
          const h = healthMap[p.health]||healthMap.caution;
          return `<div class="flex items-center gap-3 group">
            <span class="text-xs text-gray-500 w-28 truncate font-medium">${esc(p.name)}</span>
            <div class="flex-1 h-2.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full progress-bar" style="width:${p.progress}%;background:${p.color}"></div>
            </div>
            <span class="text-xs text-gray-400 tabular-nums w-10 text-right font-semibold">${p.progress}%</span>
            <span class="w-1.5 h-1.5 rounded-full ${h.dot}"></span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Action Alerts -->
    ${renderAlert(icons.users, '人に聞いた方がいい', '#8b5cf6', 'bg-violet-50/50', 'border-violet-100', humanItems)}
    ${renderAlert(icons.zap, 'AIが今すぐ対応できる', '#3b82f6', 'bg-blue-50/50', 'border-blue-100', aiItems)}

    <!-- Project Cards -->
    <div class="pt-2 space-y-3">
      ${sortedCards.map(p => renderCard(p)).join('')}
    </div>`;
}

function renderAlert(icon, title, color, bg, border, items) {
  if(!items.length) return '';
  return `<div class="rounded-2xl border ${border} ${bg} overflow-hidden mb-4">
    <div class="px-5 py-3 flex items-center gap-2.5 border-b" style="border-color:${color}15">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:${color}15">
        <span style="color:${color}">${icon}</span>
      </div>
      <h3 class="text-sm font-bold" style="color:${color}">${esc(title)}</h3>
      <span class="ml-auto text-[11px] font-bold px-2 py-0.5 rounded-full" style="background:${color}15;color:${color}">${items.length}件</span>
    </div>
    <div class="px-5 py-3 space-y-2">
      ${items.map(it => `<div class="flex items-start gap-2.5 group">
        <span class="mt-0.5 shrink-0 opacity-40 group-hover:opacity-100 transition-opacity" style="color:${color}">${icons.arrowRight}</span>
        <span class="text-sm text-gray-600">
          <span class="font-bold" style="color:${color}">${esc(it.project)}</span>
          <span class="text-gray-300 mx-1.5">—</span>${esc(it.text)}
        </span>
      </div>`).join('')}
    </div>
  </div>`;
}

        <span class="text-[10px] font-bold uppercase tracking-wider ${c.color}">${c.label}</span>

      solvedItems.push({ project: p.name, projectColor: p.color, ...b });

  return `

    <div class="mb-6">

        <span class="ml-auto text-xs font-bold text-violet-500 bg-violet-50 px-2 py-0.5 rounded-full">${humanItems.length}件</span>

        <h2 class="text-sm font-bold text-gray-700">AIが対応できる課題</h2>
        <span class="ml-auto text-xs font-bold text-blue-500 bg-blue-50 px-2 py-0.5 rounded-full">${aiItems.length}件</span>

      ${aiItems.length===0 ? '<div class="text-center py-10 text-gray-300 text-sm bg-white rounded-2xl border border-gray-100">なし</div>' :

    <!-- Solved -->

        <div class="w-8 h-8 rounded-xl bg-emerald-50 flex items-center justify-center"><span class="text-emerald-500">${icons.check}</span></div>
        <h2 class="text-sm font-bold text-gray-700">解決済み</h2>
      </div>
      ${solvedItems.length===0 ? '<div class="text-center py-10 text-gray-300 text-sm bg-white rounded-2xl border border-gray-100">なし</div>' :

}

function groupBlockersByProject(items, colorName, faded=false) {
  const groups = {};
  items.forEach(it => { (groups[it.project]??=[]).push(it); });
  return Object.entries(groups).map(([name, bs]) => {
    return `<div class="bg-white rounded-2xl border border-${colorName}-100 p-4 ${faded?'opacity-60':''}">
      <div class="text-xs font-bold text-${colorName}-500 mb-2 flex items-center gap-2">
        <div class="w-2 h-2 rounded-full" style="background:${bs[0].projectColor}"></div>${esc(name)}
      </div>
      <div class="space-y-2">
        ${bs.map(b => `<div class="text-sm text-gray-600 flex items-start gap-2">
          ${faded?`<span class="text-emerald-400 mt-0.5">${icons.check}</span><span class="line-through">${esc(b.text)}</span>`
                 :`<span class="text-gray-300 mt-0.5">${icons.arrowRight}</span><span>${esc(b.text)}${b.detail?` <span class="text-xs text-gray-400">— ${esc(b.detail)}</span>`:''}</span>`}
        </div>`).join('')}
      </div>
    </div>`;
  });
}

// ─── CRUD Actions ───
window.setTab = function(t) { state.tab = t; render(); };
window.toggleExpand = function(id) { state.expandedId = state.expandedId===id ? null : id; render(); };
window.doLogout = async function() { await sb.auth.signOut(); state.user=null; state.projects=[]; render(); };

window.toggleMilestone = async function(id, done) {
  const { error } = await sb.from('nv_milestones').update({ done }).eq('id', id);
  if(error) { toast('更新エラー','error'); return; }
  // Update local & recalc progress
  for(const pid in state.milestones) {
    const m = state.milestones[pid].find(m=>m.id===id);
    if(m) { m.done = done; await recalcProgress(pid); break; }
  }
  render();
};

async function recalcProgress(pid) {
  const ms = state.milestones[pid]||[];
  if(!ms.length) return;
  const progress = Math.round((ms.filter(m=>m.done).length / ms.length) * 100);
  await sb.from('nv_projects').update({ progress }).eq('id', pid);
  const p = state.projects.find(p=>p.id===pid);
  if(p) p.progress = progress;
}

window.deleteProject = async function(id) {
  if(!confirm('このプロジェクトを削除しますか？')) return;
  const { error } = await sb.from('nv_projects').delete().eq('id', id);
  if(error) { toast('削除エラー','error'); return; }
  state.projects = state.projects.filter(p=>p.id!==id);
  delete state.milestones[id]; delete state.blockers[id]; delete state.wins[id];
  if(state.expandedId===id) state.expandedId=null;
  toast('削除しました'); render();
};

window.deleteMilestone = async function(id, pid) {
  const { error } = await sb.from('nv_milestones').delete().eq('id', id);
  if(error) { toast('削除エラー','error'); return; }
  state.milestones[pid] = (state.milestones[pid]||[]).filter(m=>m.id!==id);
  await recalcProgress(pid);
  toast('削除しました'); render();
};

window.deleteBlocker = async function(id, pid) {
  const { error } = await sb.from('nv_blockers').delete().eq('id', id);
  if(error) { toast('削除エラー','error'); return; }
  state.blockers[pid] = (state.blockers[pid]||[]).filter(b=>b.id!==id);
  toast('削除しました'); render();
};

window.deleteWin = async function(id, pid) {
  const { error } = await sb.from('nv_wins').delete().eq('id', id);
  if(error) { toast('削除エラー','error'); return; }
  state.wins[pid] = (state.wins[pid]||[]).filter(w=>w.id!==id);
  toast('削除しました'); render();
};

window.cycleBlockerType = async function(id, current, pid) {
  const order = ['ai','human','solved'];
  const next = order[(order.indexOf(current)+1) % order.length];
  const { error } = await sb.from('nv_blockers').update({ type: next }).eq('id', id);
  if(error) { toast('更新エラー','error'); return; }
  const b = (state.blockers[pid]||[]).find(b=>b.id===id);
  if(b) b.type = next;
  toast(`タイプ変更: ${blockerStyles[next].label}`); render();
};

window.addWin = async function(pid) {
  const text = prompt('成果を入力:');
  if(!text?.trim()) return;
  const { data, error } = await sb.from('nv_wins').insert({ project_id: pid, user_id: state.user.id, text: text.trim() }).select().single();
  if(error) { toast('追加エラー','error'); return; }
  (state.wins[pid]??=[]).unshift(data);
  toast('追加しました'); render();
};

    </div>
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2">
      <button onclick="document.getElementById('modal-overlay').remove()" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">キャンセル</button>
      <button onclick="saveProject('${id||''}')" class="px-5 py-2 rounded-xl text-sm font-semibold text-white btn-primary">保存</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
};

window.saveProject = async function(id) {
  const name = document.getElementById('m-name').value.trim();
  if(!name) { toast('名前を入力してください','error'); return; }
  const data = {
    name,
    color: document.getElementById('m-color-val').value,
    health: document.getElementById('m-health').value,
    goal: document.getElementById('m-goal').value.trim(),
    done_image: document.getElementById('m-doneimg').value.trim(),
    phase: document.getElementById('m-phase').value.trim(),
    owner: document.getElementById('m-owner').value.trim(),
  };
  if(id) {
    // Update
    const progEl = document.getElementById('m-progress');
    if(progEl) data.progress = parseInt(progEl.value);
    const { error } = await sb.from('nv_projects').update(data).eq('id', id);
    if(error) { toast('更新エラー','error'); return; }
    const p = state.projects.find(p=>p.id===id);
    if(p) Object.assign(p, data);
  } else {
    // Insert
    data.user_id = state.user.id;
    data.progress = 0;
    data.sort_order = state.projects.length + 1;
    const { data: newP, error } = await sb.from('nv_projects').insert(data).select().single();
    if(error) { toast('追加エラー','error'); return; }
    state.projects.push(newP);
    state.milestones[newP.id] = [];
    state.blockers[newP.id] = [];
    state.wins[newP.id] = [];
  }
  document.getElementById('modal-overlay').remove();
  toast(id?'更新しました':'追加しました'); render();
};

// ─── Modal: Milestone ───
window.openMilestoneModal = function(pid) {
  const modal = document.createElement('div');
  modal.id = 'modal-overlay';
  modal.className = 'fixed inset-0 z-40 modal-overlay flex items-center justify-center p-4';
  modal.onclick = (e) => { if(e.target===modal) modal.remove(); };
  modal.innerHTML = `
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm fade-in" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <h2 class="text-base font-bold text-gray-800">マイルストーン追加</h2>
      <button onclick="document.getElementById('modal-overlay').remove()" class="text-gray-300 hover:text-gray-500">${icons.x}</button>
    </div>
    <div class="px-6 py-5 space-y-3">
      <input id="m-ms-label" placeholder="マイルストーン名" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm">
    </div>
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2">
      <button onclick="document.getElementById('modal-overlay').remove()" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">キャンセル</button>
      <button onclick="saveMilestone('${pid}')" class="px-5 py-2 rounded-xl text-sm font-semibold text-white btn-primary">追加</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  setTimeout(()=>document.getElementById('m-ms-label').focus(),100);
};

window.saveMilestone = async function(pid) {
  const label = document.getElementById('m-ms-label').value.trim();
  if(!label) { toast('名前を入力してください','error'); return; }
  const ms = state.milestones[pid]||[];
  const { data, error } = await sb.from('nv_milestones').insert({
    project_id: pid, user_id: state.user.id, label, done: false, sort_order: ms.length+1
  }).select().single();
  if(error) { toast('追加エラー','error'); return; }
  (state.milestones[pid]??=[]).push(data);
  await recalcProgress(pid);
  document.getElementById('modal-overlay').remove();
  toast('追加しました'); render();
};

// ─── Modal: Blocker ───
window.openBlockerModal = function(pid) {
  const modal = document.createElement('div');
  modal.id = 'modal-overlay';
  modal.className = 'fixed inset-0 z-40 modal-overlay flex items-center justify-center p-4';
  modal.onclick = (e) => { if(e.target===modal) modal.remove(); };
  modal.innerHTML = `
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm fade-in" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <h2 class="text-base font-bold text-gray-800">課題追加</h2>
      <button onclick="document.getElementById('modal-overlay').remove()" class="text-gray-300 hover:text-gray-500">${icons.x}</button>
    </div>
    <div class="px-6 py-5 space-y-3">
      <input id="m-b-text" placeholder="課題の内容" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm">
      <select id="m-b-type" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm">
        <option value="ai">AI対応可</option>
        <option value="human">人に聞く</option>
        <option value="solved">解決済み</option>
      </select>
      <input id="m-b-detail" placeholder="詳細・Next Action (任意)" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm">
    </div>
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2">
      <button onclick="document.getElementById('modal-overlay').remove()" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">キャンセル</button>
      <button onclick="saveBlocker('${pid}')" class="px-5 py-2 rounded-xl text-sm font-semibold text-white btn-primary">追加</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  setTimeout(()=>document.getElementById('m-b-text').focus(),100);
};

window.saveBlocker = async function(pid) {
  const text = document.getElementById('m-b-text').value.trim();
  if(!text) { toast('内容を入力してください','error'); return; }
  const bs = state.blockers[pid]||[];
  const { data, error } = await sb.from('nv_blockers').insert({
    project_id: pid, user_id: state.user.id, text,
    type: document.getElementById('m-b-type').value,
    detail: document.getElementById('m-b-detail').value.trim() || null,
    sort_order: bs.length+1
  }).select().single();
  if(error) { toast('追加エラー','error'); return; }
  (state.blockers[pid]??=[]).push(data);
  document.getElementById('modal-overlay').remove();
  toast('追加しました'); render();
};

// ─── Render Engine ───
function render() {
  const app = document.getElementById('app');
  if(!state.user) { app.innerHTML = renderAuth(); return; }
  if(state.loading) { app.innerHTML = renderLoading(); return; }
  app.innerHTML = renderDashboard();
}

// ─── Init ───
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if(session) {
    state.user = session.user;
    await loadAllData();
  } else {
    render();
  }
  // Listen for auth changes
  sb.auth.onAuthStateChange((event, session) => {
    state.user = session?.user || null;
    if(!session) { state.projects=[]; render(); }
  });
}
init();
</script>
